name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Write google-services.json
        run: |
          if [ -z "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing secret: ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi
          cat > flutter_app/android/app/google-services.json <<'JSON'
          ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          JSON
      - name: Check google-services.json
        run: test -f flutter_app/android/app/google-services.json
      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build release apk
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Extract changelog section for this tag
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="$RUNNER_TEMP/release_notes.md"
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" {in_sec=1; next}
            in_sec && $0 ~ "^## \\[" {exit}
            in_sec {print}
          ' CHANGELOG.md > "$OUT" || true

          if [ -s "$OUT" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_path=$OUT" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (from changelog)
        if: steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.notes_path }}
          generate_release_notes: false
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release (auto notes fallback)
        if: steps.changelog.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
