name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Write google-services.json
        run: |
          if [ -z "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing secret: ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi
          cat > android/app/google-services.json <<'JSON'
          ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          JSON
      - name: Check google-services.json
        run: test -f android/app/google-services.json
      - name: Flutter pub get
        run: flutter pub get
      - name: Build release apk
        run: flutter build apk --release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
