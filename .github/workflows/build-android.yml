name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Write google-services.json
        run: |
          if [ -z "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" ]; then
            echo "Missing secret: ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi
          cat > android/app/google-services.json <<'JSON'
          ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          JSON
      - name: Check google-services.json
        run: test -f android/app/google-services.json
      - name: Flutter pub get
        run: flutter pub get
      - name: Build debug apk
        run: flutter build apk --debug
      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
